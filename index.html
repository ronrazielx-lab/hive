<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F1FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16122A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הכוורת">
<meta name="description" content="משימות הבית שלנו, ביחד ובכיף">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>הכוורת</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Varela+Round&display=swap">
</head>
<body>
<style>
:root{
  --bg:#F4F1FA; --card:#FFFFFF; --card2:#F9F7FD; --ink:#241F35; --muted:#7A7390; --line:#E7E2F1;
  --honey:#F2B233; --honey-deep:#D9931A; --honey-ink:#4A3200; --honey-soft:#FFF1CF;
  --good:#3FBF8A; --good-soft:#DDF6EA; --danger:#E5645A;
  --gan:#4FAEE6; --home:#9B7BEA; --shop:#F4795A;
  --shadow:0 8px 24px rgba(70,50,120,.10); --shadow-sm:0 2px 8px rgba(70,50,120,.08);
  --r:20px; --r-sm:14px;
  --font-display:'Rubik','Heebo','Arial Hebrew',Arial,sans-serif;
  --font-body:'Varela Round','Rubik','Arial Hebrew',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16122A; --card:#221C3B; --card2:#2A2347; --ink:#F2EDFB; --muted:#A79FC0; --line:#352D55;
    --honey-soft:#3D3115; --honey-ink:#FFE1A0; --good-soft:#1B3B2E;
    --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16122A; --card:#221C3B; --card2:#2A2347; --ink:#F2EDFB; --muted:#A79FC0; --line:#352D55;
  --honey-soft:#3D3115; --honey-ink:#FFE1A0; --good-soft:#1B3B2E;
  --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--honey);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:8px 16px calc(120px + env(safe-area-inset-bottom,0px))}

/* header */
.top{padding:18px 16px 4px;display:flex;flex-direction:column;gap:14px}
.hello{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hello h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.hello .date{color:var(--muted);font-size:14px;margin-top:2px}
.me{display:flex;gap:6px;align-items:center;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow-sm)}
.me button{width:40px;height:40px;border-radius:50%;font-size:20px;display:grid;place-items:center;opacity:.45;transition:transform .2s,opacity .2s}
.me button.on{opacity:1;background:var(--honey-soft);transform:scale(1.05)}
.me .lbl{font-size:12px;color:var(--muted);padding:0 6px}

.summary{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.ring{width:72px;height:72px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(90deg) scaleX(-1)}
.ring .track{fill:none;stroke:var(--line);stroke-width:8}
.ring .bar{fill:none;stroke:var(--good);stroke-width:8;stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.ring .bar.zero{opacity:0}
.ring .txt{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700}
.summary .lines{display:flex;flex-direction:column;gap:8px;min-width:0}
.summary .headline{font-family:var(--font-display);font-weight:700;font-size:17px}
.jar{display:flex;flex-direction:column;gap:5px}
.jar .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.jar .track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.jar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--honey),var(--honey-deep));transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* sections */
.section{margin-top:18px}
.section h2{font-size:15px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 4px}
.section h2 .cnt{margin-inline-start:auto;font-size:13px;font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}

/* task row */
.task{display:grid;grid-template-columns:44px 1fr 36px;align-items:center;gap:10px;background:var(--card);border-radius:var(--r-sm);padding:10px 8px 10px 4px;box-shadow:var(--shadow-sm);transition:opacity .3s,transform .3s;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--line))}
.task .check{width:44px;height:44px;display:grid;place-items:center}
.task .check span{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800;font-size:16px;transition:all .2s;background:var(--card)}
.task .check:hover span{border-color:var(--good)}
.task.done .check span{background:var(--good);border-color:var(--good);color:#fff;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.task .body{min-width:0;text-align:start}
.task .title{font-weight:500;font-size:16px;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task.done{opacity:.62}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);display:inline-flex;align-items:center;gap:4px;line-height:1.5}
.chip.cat{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink)}
.chip.pts{background:var(--honey-soft);color:var(--honey-ink)}
.task .more{width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:16px;display:grid;place-items:center}
.task .more:hover{background:var(--card2)}
.empty{background:var(--card2);border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:17px;margin-bottom:4px}

/* onboarding */
.onboard{background:linear-gradient(135deg,var(--honey-soft),var(--card));border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-top:14px;display:flex;flex-direction:column;gap:12px}
.onboard h2{font-size:20px;font-weight:800}
.onboard p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted)}
.input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;color:var(--ink)}
.input:focus{border-color:var(--honey);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:12px 18px;font-weight:700;font-family:var(--font-display);font-size:16px;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--honey),var(--honey-deep));color:#2B1D00}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}

/* board */
.catcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:12px}
.catcard .head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:color-mix(in srgb,var(--c) 14%,var(--card))}
.catcard .head .ico{width:40px;height:40px;border-radius:12px;background:var(--c);display:grid;place-items:center;font-size:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.catcard .head h3{font-size:18px;font-weight:700;flex:1}
.catcard .head .cnt{color:var(--muted);font-size:13px}
.catcard .items{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-align:start;width:100%}
.brow:hover{background:var(--card2)}
.brow .t{font-weight:500}
.brow .s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.brow .av{font-size:20px}
.catcard .addrow{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:start;width:100%}
.catcard .addrow:hover{color:var(--ink);background:var(--card2)}
.newcat{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card2);border:2px dashed var(--line);border-radius:var(--r);padding:12px}
.newcat .input{flex:1;min-width:120px}
.swatches{display:flex;gap:6px}
.swatches button{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}

/* shopping */
.shopadd{display:flex;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:2}
.shopadd .input{flex:1}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.sugg button{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-sm);color:var(--ink)}
.sugg button:hover{background:var(--honey-soft)}
.sitem{display:grid;grid-template-columns:44px 1fr 36px;align-items:center;gap:8px;background:var(--card);border-radius:var(--r-sm);padding:6px 6px 6px 2px;box-shadow:var(--shadow-sm);--c:var(--shop)}
.sitem .check{width:44px;height:44px;display:grid;place-items:center}
.sitem .check span{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800;font-size:14px;transition:all .2s}
.sitem.on .check span{background:var(--shop);border-color:var(--shop);color:#fff;animation:pop .3s}
.sitem .n{text-align:start;font-weight:500}
.sitem.on .n{text-decoration:line-through;color:var(--muted)}
.sitem .by{font-size:12px;color:var(--muted)}
.sitem .del{color:var(--muted);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.sitem .del:hover{color:var(--danger);background:var(--card2)}
.clearrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted);font-size:14px}

/* us */
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{background:var(--card);border-radius:var(--r);padding:16px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.person .av{width:64px;height:64px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:34px}
.person .nm{font-weight:700;font-family:var(--font-display);font-size:17px}
.person .pts{font-size:30px;font-weight:800;font-family:var(--font-display);color:var(--honey-deep);line-height:1}
.person .sub{font-size:12px;color:var(--muted)}
.person .edit{position:absolute;top:8px;inset-inline-end:8px;color:var(--muted);font-size:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);margin-top:12px}
.card h3{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .rt{margin-inline-start:auto;color:var(--muted);font-size:13px;font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.week .d .dot{width:100%;aspect-ratio:1;max-width:38px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink)}
.week .d.today .dot{outline:2.5px solid var(--honey);outline-offset:2px}
.bigjar{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.honeypot{width:76px;height:86px;border-radius:14px 14px 26px 26px;border:3px solid var(--line);position:relative;overflow:hidden;background:var(--card2)}
.honeypot::before{content:"";position:absolute;top:-3px;left:14px;right:14px;height:12px;border-radius:0 0 8px 8px;background:var(--line)}
.honeypot .lvl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--honey),var(--honey-deep));transition:height .8s cubic-bezier(.2,.8,.2,1)}
.honeypot .lvl::after{content:"";position:absolute;top:-6px;left:0;right:0;height:12px;background:var(--honey);border-radius:50%;opacity:.9}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted);font-size:14px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--good)}
.switch.on::after{transform:translateX(-18px)}
.note{font-size:13px;color:var(--muted);margin-top:8px}

/* tabs & fab */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:20;pointer-events:none}
.tabs .bar{pointer-events:auto;width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(60,40,100,.08)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--muted);font-size:12px;font-weight:500;transition:color .2s,background .2s}
.tabs button .i{font-size:22px;line-height:1.2;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.tabs button.on{color:var(--honey-ink);background:var(--honey-soft)}
.tabs button.on .i{transform:translateY(-2px) scale(1.1)}
.tabs button .badge{position:absolute}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(50% - 280px + 16px);width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--honey),var(--honey-deep));color:#2B1D00;font-size:32px;font-weight:400;display:grid;place-items:center;box-shadow:0 10px 24px rgba(217,147,26,.45);z-index:21;transition:transform .2s}
.fab:active{transform:scale(.94)}
@media (max-width:592px){.fab{inset-inline-end:16px}}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,12,40,.45);z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;justify-content:center}
.sheet .panel{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:12px}
.frm{display:flex;flex-direction:column;gap:14px}
.frm .lbl{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 13px;border-radius:999px;background:var(--card2);color:var(--ink);font-size:14px;border:1.5px solid transparent;transition:all .15s}
.chips button.on{background:var(--honey-soft);border-color:var(--honey);color:var(--honey-ink);font-weight:700}
.chips.days button{width:40px;height:40px;padding:0;border-radius:50%;font-family:var(--font-display)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline .input{width:80px;text-align:center}
.actions{display:flex;gap:10px;margin-top:6px;align-items:center}
.actions .primary{flex:1}
.confirm{background:color-mix(in srgb,var(--danger) 12%,var(--card));border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px}

/* toast & confetti */
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-family:var(--font-display);opacity:0;transition:all .3s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.emojirow{display:flex;gap:6px;flex-wrap:wrap}
.emojirow button{width:42px;height:42px;border-radius:12px;font-size:22px;background:var(--card2);border:2px solid transparent}
.emojirow button.on{border-color:var(--honey);background:var(--honey-soft)}

.install{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--honey);border-radius:var(--r);padding:12px 14px;margin-top:14px;box-shadow:var(--shadow-sm)}
.install .ic{font-size:28px}
.install b{font-family:var(--font-display);display:block}
.install .s{font-size:13px;color:var(--muted)}
.install .x{color:var(--muted);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.install .btn{margin-top:8px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="הוספה">+</button>
<nav class="tabs" aria-label="ניווט">
  <div class="bar" id="tabs">
    <button data-tab="today"><span class="i">☀️</span>היום</button>
    <button data-tab="board"><span class="i">🗂️</span>כל המשימות</button>
    <button data-tab="shop"><span class="i">🛒</span>קניות</button>
    <button data-tab="us"><span class="i">🐝</span>אנחנו</button>
  </div>
</nav>
<div id="sheetRoot"></div>
<div id="toast" role="status"></div>
<canvas id="confetti"></canvas>

<script>
(function(){
'use strict';
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');

/* ---------- config ---------- */
// Firebase Realtime Database config. Leave empty to run in local-only mode (each phone keeps its own copy).
// Fill from Firebase console → Project settings → Your apps → SDK setup and configuration.
const FIREBASE={
  apiKey:'', authDomain:'', databaseURL:'', projectId:'', appId:''
};
const FIREBASE_SDK='https://www.gstatic.com/firebasejs/12.4.0/';

/* ---------- helpers ---------- */
const KEY='hive.v1';
const DAYS=['א','ב','ג','ד','ה','ו','ש'];
const DAYS_FULL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const CAT_COLORS=['#4FAEE6','#9B7BEA','#F4795A','#3FBF8A','#F2B233','#E96BAE','#5AC8C8'];
const AVATARS=['🧔🏻','👩🏻','👨🏻','👩🏻‍🦱','🧑🏻','👩🏽','🐻','🦊','🐰','🐼','🦁','🐨'];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return dstr(d);};
const weekStart=s=>addDays(s,-parse(s).getDay());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- domain ---------- */
function isDue(t,ds){
  const r=t.repeat||{type:'days',days:[0,1,2,3,4,5,6]};
  const dow=parse(ds).getDay();
  if(r.type==='days') return (r.days||[]).includes(dow);
  if(r.type==='every'){ const n=Math.max(1,r.n||1); const from=r.from||ds; const df=diffDays(from,ds); return df>=0 && df%n===0; }
  if(r.type==='once'){ if(t.doneOnce && t.doneOnce!==ds) return false; return ds>=r.date; }
  return false;
}
function dueOn(ds){ return state.tasks.filter(t=>isDue(t,ds)); }
function isDone(t,ds){ return !!state.done[t.id+'|'+ds]; }
function toggle(t,ds){
  const k=t.id+'|'+ds; const once=t.repeat&&t.repeat.type==='once';
  if(state.done[k]){
    delete state.done[k]; if(once) delete t.doneOnce; save();
    const m={}; m['done/'+k]=null; if(once) m['tasks/'+t.id+'/doneOnce']=null; sync.multi(m);
    return false;
  }
  state.done[k]={by:state.me,at:Date.now(),pts:t.pts||1,date:ds};
  if(once) t.doneOnce=ds;
  save();
  const m={}; m['done/'+k]=state.done[k]; if(once) m['tasks/'+t.id+'/doneOnce']=ds; sync.multi(m);
  return true;
}
function weekPoints(uidv){
  const ws=weekStart(today()), we=addDays(ws,6); let sum=0;
  for(const k in state.done){ const d=state.done[k]; if(d.date>=ws&&d.date<=we&&(!uidv||d.by===uidv)) sum+=d.pts||1; }
  return sum;
}
function totalDone(uidv){ let n=0; for(const k in state.done){ if(state.done[k].by===uidv) n++; } return n; }
function dayRatio(ds){ const due=dueOn(ds); if(!due.length) return null; return due.filter(t=>isDone(t,ds)).length/due.length; }
function streak(){
  let ds=today(); let n=0;
  const r0=dayRatio(ds); if(r0!==null&&r0<1) ds=addDays(ds,-1);
  for(let i=0;i<120;i++){ const r=dayRatio(ds); if(r===null){ ds=addDays(ds,-1); continue; } if(r<1) break; n++; ds=addDays(ds,-1); }
  return n;
}
function userName(id){ const u=state.users.find(u=>u.id===id); if(!u) return ''; return u.name||(id==='a'?'אני':'בת הזוג'); }
function userEmoji(id){ const u=state.users.find(u=>u.id===id); return u?u.emoji:'🙂'; }
function cat(id){ return state.cats.find(c=>c.id===id)||{id,name:'?',emoji:'📌',color:'#999'}; }
function repeatLabel(r){
  if(!r) return 'כל יום';
  if(r.type==='once') return 'חד־פעמי · '+fmtShort(r.date);
  if(r.type==='every') return r.n===1?'כל יום':'כל '+r.n+' ימים';
  const d=r.days||[];
  if(d.length===7) return 'כל יום';
  if(d.length===5&&[0,1,2,3,4].every(x=>d.includes(x))) return 'ימי גן (א׳–ה׳)';
  if(d.length===1) return 'כל יום '+DAYS_FULL[d[0]];
  if(d.length===0) return 'לא מתוזמן';
  return d.slice().sort().map(x=>DAYS[x]+'׳').join(' ');
}
function fmtShort(ds){ try{ return new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'short'}).format(parse(ds)); }catch(e){ return ds; } }
function greeting(){ const h=new Date().getHours(); if(h<5) return 'לילה טוב'; if(h<12) return 'בוקר טוב'; if(h<17) return 'צהריים טובים'; if(h<21) return 'ערב טוב'; return 'לילה טוב'; }
function heDate(){ try{ return new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}).format(new Date()); }catch(e){ return today(); } }

/* ---------- sync: Firebase Realtime Database, one "house" per couple ---------- */
// Server layout: houses/<code>/{users/{a,b}, cats/<id>, tasks/<id>, done/<taskId|date>, shop/<id>, settings/{goal,reward,onboarded}}
// Per-device only (never synced): state.me, settings.sound.
// Writes are small targeted ops queued in an outbox (localStorage) so nothing is lost if the app closes while offline.
const CODE_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normCode(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); }
function fmtCode(c){ c=normCode(c); return c.length===8? c.slice(0,4)+'-'+c.slice(4) : c; }
function genCode(){ const a=new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a,b=>CODE_ALPHABET[b%CODE_ALPHABET.length]).join(''); }
const sync={
  enabled: !!(FIREBASE&&FIREBASE.databaseURL&&FIREBASE.apiKey),
  code:null, db:null, ref:null, online:false, ready:false, error:null, outbox:[], flushing:false,
};
try{ sync.code=normCode(localStorage.getItem('hive.house'))||null; }catch(e){}
try{ sync.outbox=JSON.parse(localStorage.getItem('hive.outbox')||'[]')||[]; }catch(e){ sync.outbox=[]; }
function saveOutbox(){ try{ localStorage.setItem('hive.outbox',JSON.stringify(sync.outbox)); }catch(e){} }
sync.push=(p,v)=>{ if(!sync.code) return; sync.outbox.push({p,v:v===undefined?null:v}); saveOutbox(); flushOutbox(); };
sync.multi=(m)=>{ if(!sync.code) return; sync.outbox.push({m}); saveOutbox(); flushOutbox(); };
async function flushOutbox(){
  if(!sync.ref||sync.flushing) return; sync.flushing=true;
  try{
    while(sync.outbox.length&&sync.ref){
      const op=sync.outbox[0];
      if(op.m) await sync.ref.update(op.m); else await sync.ref.child(op.p).set(op.v===undefined?null:op.v);
      sync.outbox.shift(); saveOutbox();
    }
  }catch(e){ sync.error=e; }
  sync.flushing=false;
}
function toServer(st){
  const o={users:{},cats:{},tasks:{},done:st.done||{},shop:{},settings:{goal:st.settings.goal||40,reward:st.settings.reward||'',onboarded:!!st.settings.onboarded}};
  st.users.forEach(u=>o.users[u.id]=u);
  st.cats.forEach((c,i)=>o.cats[c.id]=Object.assign({},c,{order:i}));
  st.tasks.forEach(t=>o.tasks[t.id]=t);
  st.shop.forEach(s=>o.shop[s.id]=s);
  return o;
}
function fromServer(v){
  v=v||{}; const s=v.settings||{};
  const defU=[{id:'a',name:'',emoji:'🧔🏻'},{id:'b',name:'',emoji:'👩🏻'}];
  return {
    v:1,
    users: defU.map(d=>Object.assign(d,(v.users||{})[d.id]||{})),
    me: state.me,
    cats: Object.values(v.cats||{}).sort((a,b)=>(a.order||0)-(b.order||0)),
    tasks: Object.values(v.tasks||{}),
    done: v.done||{},
    shop: Object.values(v.shop||{}).sort((a,b)=>(b.at||0)-(a.at||0)),
    settings:{sound:state.settings.sound!==false,goal:s.goal||40,reward:s.reward||'משהו טעים 🍰',onboarded:s.onboarded!==false}
  };
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(s); }); }
async function syncInit(){
  if(!sync.enabled){ if(pendingJoin) toast('הסנכרון עדיין לא פעיל בגרסה הזו'); return; }
  try{
    await loadScript(FIREBASE_SDK+'firebase-app-compat.js');
    await loadScript(FIREBASE_SDK+'firebase-database-compat.js');
    firebase.initializeApp(FIREBASE); sync.db=firebase.database();
    sync.db.ref('.info/connected').on('value',s=>{ sync.online=!!s.val(); if(sync.online) flushOutbox(); if(tab==='us') scheduleRender(); });
  }catch(e){ sync.error=e; if(tab==='us') scheduleRender(); return; }
  if(pendingJoin&&pendingJoin!==sync.code){ const c=pendingJoin; pendingJoin=null; try{ await syncJoin(c); toast('הצטרפת לכוורת! 🐝'); }catch(e){ toast('לא נמצאה כוורת עם הקוד הזה'); } }
  else if(sync.code) syncAttach();
}
function syncAttach(){
  if(!sync.db||!sync.code) return;
  if(sync.ref) sync.ref.off();
  sync.ref=sync.db.ref('houses/'+sync.code);
  sync.ref.on('value',snap=>{
    const v=snap.val(); if(v===null) return; // house not there (deleted?) — keep local copy
    state=fromServer(v); sync.ready=true; save(); scheduleRender();
  },err=>{ sync.error=err; scheduleRender(); });
  flushOutbox();
}
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }
async function syncCreate(){
  if(!sync.db) throw new Error('no db');
  const code=genCode();
  await withTimeout(sync.db.ref('houses/'+code).set(toServer(state)),12000);
  sync.code=code; try{ localStorage.setItem('hive.house',code); }catch(e){}
  syncAttach();
}
async function syncJoin(code){
  code=normCode(code); if(code.length!==8) throw new Error('bad code');
  if(!sync.db) throw new Error('no db');
  const snap=await withTimeout(sync.db.ref('houses/'+code).get(),12000);
  if(!snap.exists()) throw new Error('not found');
  sync.code=code; try{ localStorage.setItem('hive.house',code); }catch(e){}
  sync.outbox=[]; saveOutbox();
  syncAttach();
}
function syncLeave(){
  if(sync.ref) sync.ref.off(); sync.ref=null; sync.code=null; sync.ready=false; sync.outbox=[]; saveOutbox();
  try{ localStorage.removeItem('hive.house'); }catch(e){}
}
function inviteUrl(){ return location.origin+location.pathname+'?join='+sync.code+'&as='+(state.me==='a'?'b':'a'); }
async function shareInvite(){
  const text='הצטרפ/י לכוורת שלנו 🐝 המשימות והקניות של הבית במקום אחד.\nקוד הכוורת: '+fmtCode(sync.code)+'\n'+inviteUrl();
  try{ if(navigator.share){ await navigator.share({title:'הכוורת',text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('ההזמנה הועתקה, שלחו אותה בוואטסאפ 📨'); }catch(e){ toast('הקוד: '+fmtCode(sync.code)); }
}
// A remote change while a sheet is open or the user is typing waits until they're done.
let pendingRender=false;
function scheduleRender(){
  const ae=document.activeElement; const typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  if(typing||$('#sheetRoot').children.length){ pendingRender=true; return; }
  render();
}
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(pendingRender&&!$('#sheetRoot').children.length){ const ae=document.activeElement; if(!(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))) render(); } },150); });

/* ---------- feedback: sound, haptics, confetti, toast ---------- */
let actx;
function beep(kind){
  if(!state.settings.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const now=actx.currentTime;
    const notes=kind==='win'?[523,659,784,1046]:kind==='undo'?[440]:[660,880];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=f;
      const t0=now+i*0.09; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.22,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.22);
    });
  }catch(e){}
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
let toastT;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2200); }
function confetti(){
  if(reduced) return;
  const c=$('#confetti'), ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#F2B233','#4FAEE6','#9B7BEA','#F4795A','#3FBF8A','#E96BAE'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-0.5)*120,y:innerHeight*0.55,vx:(Math.random()-0.5)*14,vy:-Math.random()*16-6,r:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*Math.PI,va:(Math.random()-0.5)*0.3}));
  let f=0; const start=performance.now();
  function step(now){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.vy+=0.45;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();});
    if(now-start<2200) requestAnimationFrame(step); else ctx.clearRect(0,0,c.width,c.height);
  }
  requestAnimationFrame(step);
}

/* ---------- render: header ---------- */
function renderTop(){
  const ds=today(); const due=dueOn(ds); const done=due.filter(t=>isDone(t,ds)).length; const total=due.length;
  const pct=total?done/total:0; const C=2*Math.PI*30;
  const wp=weekPoints(); const goal=state.settings.goal||40;
  const meName=userName(state.me);
  const headline= total===0?'אין משימות להיום. יום חופשי! 🌴' : done===total?'סיימתם את כל המשימות של היום 🎉' : done===0?'יש '+total+' משימות היום. יאללה!' : 'נשארו '+(total-done)+' משימות. כמעט שם!';
  $('#top').innerHTML=`
    <div class="hello">
      <div><h1>${esc(greeting())}, ${esc(meName)} 👋</h1><div class="date">${esc(heDate())}</div></div>
      <div class="me" title="מי משתמש עכשיו?"><span class="lbl">אני:</span>${state.users.map(u=>`<button data-me="${u.id}" class="${u.id===state.me?'on':''}" aria-label="${esc(userName(u.id))}">${u.emoji}</button>`).join('')}</div>
    </div>
    ${tab==='today'?`<div class="summary">
      <div class="ring"><svg viewBox="0 0 72 72"><circle class="track" cx="36" cy="36" r="30"/><circle class="bar ${pct===0?"zero":""}" cx="36" cy="36" r="30" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="txt num">${done}/${total}</div></div>
      <div class="lines"><div class="headline">${esc(headline)}</div>
        <div class="jar"><div class="row"><span>🍯 צנצנת הדבש השבועית</span><span class="num">${wp}/${goal}</span></div><div class="track"><div class="fill" style="width:${Math.min(100,wp/goal*100)}%"></div></div></div>
      </div>
    </div>`:''}`;
  $$('#top [data-me]').forEach(b=>b.onclick=()=>{ state.me=b.dataset.me; save(); render(); toast('עכשיו '+userName(state.me)+' '+userEmoji(state.me)); });
}

/* ---------- render: today ---------- */
function taskRow(t,ds){
  const c=cat(t.cat); const d=isDone(t,ds); const rec=state.done[t.id+'|'+ds];
  const who= t.who==='any' ? (d&&rec?`<span class="chip">${userEmoji(rec.by)} ${esc(userName(rec.by))}</span>`:`<span class="chip">🤝 מי שמגיע קודם</span>`) : `<span class="chip">${userEmoji(t.who)} ${esc(userName(t.who))}</span>`;
  return `<div class="task ${d?'done':''}" style="--c:${c.color}" data-id="${t.id}">
    <button class="check" aria-pressed="${d}" aria-label="${d?'בטל סיום':'סיימתי'}: ${esc(t.title)}"><span>✓</span></button>
    <div class="body" role="button" tabindex="0"><div class="title">${esc(t.title)}</div>
      <div class="meta"><span class="chip cat" style="--c:${c.color}">${c.emoji} ${esc(c.name)}</span>${who}<span class="chip pts">🍯${t.pts>1?' ×'+t.pts:''}</span></div></div>
    <button class="more" aria-label="עריכה">✎</button>
  </div>`;
}
function renderToday(){
  const ds=today(); const due=dueOn(ds);
  const groups=[['morning','🌅 בוקר'],['evening','🌙 ערב'],['any','✨ מתי שנוח']];
  let html=installBanner();
  if(!state.settings.onboarded){
    html+=`<div class="onboard"><h2>ברוכים הבאים לכוורת 🐝</h2><p>המקום שבו כל משימות הבית מסתדרות, ובדרך גם נהנים. איך קוראים לכם?</p>
      <div class="field"><label for="nameA">השם שלי</label><input id="nameA" class="input" value="${esc(state.users[0].name)}" placeholder="שם"></div>
      <div class="field"><label for="nameB">בת הזוג</label><input id="nameB" class="input" value="${esc(state.users[1].name)}" placeholder="שם"></div>
      <button class="btn primary block" id="onboardGo">יאללה, מתחילים 🚀</button></div>`;
  }
  const sort=(a,b)=>(isDone(a,ds)-isDone(b,ds))||a.title.localeCompare(b.title,'he');
  let any=false;
  groups.forEach(([k,label])=>{
    const list=due.filter(t=>(t.when||'any')===k).sort(sort); if(!list.length) return; any=true;
    const dn=list.filter(t=>isDone(t,ds)).length;
    html+=`<section class="section"><h2>${label}<span class="cnt num">${dn}/${list.length}</span></h2><div class="list">${list.map(t=>taskRow(t,ds)).join('')}</div></section>`;
  });
  if(!any) html+=`<div class="empty" style="margin-top:16px"><b>אין משימות להיום</b>אפשר להוסיף משימה עם הכפתור הצהוב, או פשוט לנוח ☕</div>`;
  $('#view').innerHTML=html;
  bindTaskRows(ds);
  const ib=$('#installBtn'); if(ib) ib.onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; render(); };
  const ix=$('#installHide'); if(ix) ix.onclick=()=>{ try{ localStorage.setItem('hive.installHide','1'); }catch(e){} render(); };
  const go=$('#onboardGo'); if(go) go.onclick=()=>{ state.users[0].name=$('#nameA').value.trim()||'רון'; state.users[1].name=$('#nameB').value.trim(); state.settings.onboarded=true; save(); sync.multi({'users/a/name':state.users[0].name,'users/b/name':state.users[1].name,'settings/onboarded':true}); beep('win'); render(); toast('נעים להכיר! 🐝'); };
}
function bindTaskRows(ds){
  $$('.task').forEach(row=>{
    const t=state.tasks.find(x=>x.id===row.dataset.id); if(!t) return;
    $('.check',row).onclick=()=>{
      const t=state.tasks.find(x=>x.id===row.dataset.id); if(!t) return; // re-lookup: state may have been replaced by a sync snapshot
      const nowDone=toggle(t,ds);
      if(nowDone){ beep('done'); buzz(20); } else beep('undo');
      const due=dueOn(ds); const all=due.length&&due.every(x=>isDone(x,ds));
      render();
      if(nowDone&&all){ beep('win'); buzz([30,50,30]); confetti(); toast('כל הכבוד! סיימתם את היום 🎉'); }
      else if(nowDone){ const wp=weekPoints(); if(wp>=state.settings.goal&&wp-(t.pts||1)<state.settings.goal){ confetti(); toast('הצנצנת מלאה! מגיע לכם: '+state.settings.reward); } }
    };
    const open=()=>{ const cur=state.tasks.find(x=>x.id===row.dataset.id); if(cur) openTaskSheet(cur); };
    $('.more',row).onclick=open; const body=$('.body',row); body.onclick=open; body.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } };
  });
}

  bindSyncCard();

function syncCard(){
  const status= !sync.enabled?'' : sync.error&&!sync.code?'<span style="color:var(--danger)">שגיאה</span>' : !sync.code?'' : sync.online?'🟢 מחובר' : '⚪ לא מקוון';

  else if(!sync.code) body=`<p class="note" style="margin:0 0 10px">כדי ששניכם תראו אותה רשימה: אחד מכם יוצר כוורת כאן, ושולח הזמנה לשני.</p>

    if(curPreset==='daily') d.repeat={type:'days',days:[0,1,2,3,4,5,6]};
    else if(curPreset==='gan') d.repeat={type:'days',days:[0,1,2,3,4]};
    else if(curPreset==='custom') d.repeat={type:'days',days:$$('#tDays button.on').map(b=>parseInt(b.dataset.day,10))};
    else if(curPreset==='every') d.repeat={type:'every',n:Math.max(1,parseInt($('#tN').value,10)||1),from:$('#tFrom').value||today()};
    else d.repeat={type:'once',date:$('#tDate').value||today()};
    if(isNew){ d.id=uid(); d.created=today(); state.tasks.push(d); toast('המשימה נוספה 🐝'); }
    else { const i=state.tasks.findIndex(x=>x.id===t.id); if(i>=0) state.tasks[i]=d; else state.tasks.push(d); toast('נשמר'); }
    save(); sync.push('tasks/'+d.id,d); closeSheet(); render();
  };
  const del=$('#tDelete'); if(del) del.onclick=()=>{ $('#tConfirm').innerHTML=`<div class="confirm"><span>למחוק את "${esc(d.title)}"?</span><span style="display:flex;gap:6px"><button class="btn sm ghost" type="button" id="dNo">לא</button><button class="btn sm primary" type="button" id="dYes">כן</button></span></div>`; $('#dNo').onclick=()=>{ $('#tConfirm').innerHTML=''; }; $('#dYes').onclick=()=>{ state.tasks=state.tasks.filter(x=>x.id!==t.id); save(); sync.push('tasks/'+t.id,null); closeSheet(); render(); toast('נמחק'); }; };
}

function openCatSheet(c){
  const inUse=state.tasks.filter(t=>t.cat===c.id).length;
  openSheet(`<h2>עריכת קטגוריה</h2><form class="frm" id="catForm">
    <div class="inline"><input id="cEmoji" class="input" style="width:64px;text-align:center" value="${esc(c.emoji)}" aria-label="אימוג׳י"><input id="cName" class="input" style="flex:1" value="${esc(c.name)}" required aria-label="שם"></div>
    <div><span class="lbl">צבע</span><div class="swatches" id="cCols">${CAT_COLORS.map(col=>`<button type="button" data-col="${col}" class="${col===c.color?'on':''}" style="background:${col}" aria-label="צבע"></button>`).join('')}</div></div>
    <div class="actions"><button class="btn primary" type="submit">שמירה</button><button class="btn ghost" type="button" id="cCancel">ביטול</button>${inUse?'':'<button class="btn danger" type="button" id="cDelete">מחיקה</button>'}</div>
    ${inUse?`<p class="note">אפשר למחוק קטגוריה רק כשאין בה משימות (יש ${inUse}).</p>`:''}
  </form>`);
  let col=c.color;
  $$('#cCols button').forEach(b=>b.onclick=()=>{ col=b.dataset.col; $$('#cCols button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#cCancel').onclick=closeSheet;
  $('#catForm').onsubmit=e=>{ e.preventDefault(); const cc=state.cats.find(x=>x.id===c.id)||c; cc.name=$('#cName').value.trim()||cc.name; cc.emoji=$('#cEmoji').value.trim()||cc.emoji; cc.color=col; if(cc.order==null) cc.order=state.cats.indexOf(cc); save(); sync.push('cats/'+cc.id,cc); closeSheet(); render(); };
  const del=$('#cDelete'); if(del) del.onclick=()=>{ state.cats=state.cats.filter(x=>x.id!==c.id); save(); sync.push('cats/'+c.id,null); closeSheet(); render(); toast('הקטגוריה נמחקה'); };
}

function openUserSheet(u){
  openSheet(`<h2>מי זה? ${u.emoji}</h2><form class="frm" id="userForm">
    <div><input id="uName" class="input" value="${esc(u.name)}" placeholder="שם" maxlength="30" aria-label="שם"></div>
    <div><span class="lbl">אווטאר</span><div class="emojirow" id="uEmoji">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===u.emoji?'on':''}">${a}</button>`).join('')}</div></div>
    <div class="actions"><button class="btn primary" type="submit">שמירה</button><button class="btn ghost" type="button" id="uCancel">ביטול</button></div></form>`);
  let av=u.emoji;
  $$('#uEmoji button').forEach(b=>b.onclick=()=>{ av=b.dataset.av; $$('#uEmoji button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#uCancel').onclick=closeSheet;
  $('#userForm').onsubmit=e=>{ e.preventDefault(); const uu=state.users.find(x=>x.id===u.id)||u; uu.name=$('#uName').value.trim(); uu.emoji=av; save(); sync.push('users/'+uu.id,uu); closeSheet(); render(); };
}

/* ---------- PWA: install + offline ---------- */
let deferredPrompt=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const framed=(()=>{ try{ return window.top!==window; }catch(e){ return true; } })();
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; if(tab==='today') render(); });
addEventListener('appinstalled',()=>{ deferredPrompt=null; toast('הכוורת מותקנת! 🐝'); render(); });
function installBanner(){
  if(standalone||framed) return '';
  let hidden=false; try{ hidden=localStorage.getItem('hive.installHide')==='1'; }catch(e){}
  if(hidden) return '';
  if(deferredPrompt) return `<div class="install"><span class="ic">📲</span><div><b>להתקין את הכוורת על הטלפון?</b><span class="s">היא תיפתח כמו אפליקציה רגילה, גם בלי אינטרנט.</span><button class="btn primary sm" id="installBtn">התקנה</button></div><button class="x" id="installHide" aria-label="סגירה">×</button></div>`;
  if(isIOS) return `<div class="install"><span class="ic">📲</span><div><b>להתקין את הכוורת על האייפון?</b><span class="s">בספארי: לחצו על כפתור השיתוף <span style="display:inline-block;transform:translateY(2px)">⎋</span> ואז על <b style="display:inline">"הוסף למסך הבית"</b>.</span></div><button class="x" id="installHide" aria-label="סגירה">×</button></div>`;
  return '';
}
if('serviceWorker' in navigator && !framed && /^https?:$/.test(location.protocol)){
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded) return; reloaded=true; toast('יש גרסה חדשה, מרעננים ✨'); setTimeout(()=>location.reload(),900); });
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

/* ---------- shell ---------- */
function render(){
  pendingRender=false;
  renderTop();
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#fab').hidden = tab==='us';
  $('#fab').textContent = tab==='shop' ? '🛒' : '+';
  if(tab==='today') renderToday(); else if(tab==='board') renderBoard(); else if(tab==='shop') renderShop(); else renderUs();
}
$$('#tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; try{ sessionStorage.setItem('hive.tab',tab); }catch(e){} newCatOpen=false; render(); scrollTo({top:0,behavior:reduced?'auto':'smooth'}); });
$('#fab').onclick=()=>{ if(tab==='shop'){ const i=$('#shopInput'); if(i) i.focus(); return; } openTaskSheet(null, tab==='board'?null:null); };
addEventListener('resize',()=>{ const c=$('#confetti'); c.width=innerWidth; c.height=innerHeight; });
render();
syncInit();
// re-render at midnight so "today" rolls over while the page stays open
setInterval(()=>{ if(render._day!==today()){ render._day=today(); render(); } },60000); render._day=today();
})();
</script>
